services:
  - type: web
    name: website-migration-tool
    env: node
    plan: free
    buildCommand: npm install --include=dev && npm run build && npx puppeteer browsers install chrome
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PUPPETEER_CACHE_DIR
        value: /opt/render/project/src/.cache/puppeteer
